[project]
name = "event-alpha"
version = "1.2.0"
description = "Event-driven A-share alpha candidate factors"
requires-python = ">=3.11"
dependencies = ["akshare==1.20.65"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
